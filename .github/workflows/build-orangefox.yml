name: Build OrangeFox (algiz / vendor_boot)

# OrangeFox Recovery for the Volla Phone Quintus (algiz).
# This device has NO standalone recovery partition: recovery is a ramdisk
# fragment of type `recovery` inside the hdr-v4 vendor_boot. The build therefore
# targets `vendorbootimage` and uses FOX_VENDOR_BOOT_RECOVERY=1 (set in the
# device tree's vendorsetup.sh). The stock GKI kernel is reused (prebuilt).
#
# Everything compiles on the GitHub runner — the maintainer's host has a tight
# disk quota and cannot sync/build AOSP locally.

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox sync branch (14.1 experimental is the A16 best-match; 12.1 fallback)"
        required: true
        default: "14.1"
      build_target:
        description: "mka target (vendorbootimage for this vendor_boot-as-recovery device)"
        required: true
        default: "vendorbootimage"
      lunch_combo:
        description: "lunch combo (A14+ needs the release token; fox_14.1 uses ap2a)"
        required: true
        default: "twrp_algiz-ap2a-eng"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Maximize build disk space
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="; df -h /; echo; free -h
          # Reclaim preinstalled toolchains we don't use (ubuntu-24.04). These are
          # self-contained directories (safe to rm) and are where the real space
          # is — NOT apt packages. fox_14.1 needs ~85 GB synced; everything is on
          # one /dev/root fs, so disk is the tight constraint.
          #
          # NOTE: do NOT `apt-get purge` these toolchains — rm'ing their dirs then
          # purging the matching packages leaves dpkg half-broken (maintainer
          # scripts fail on the missing files) and the later build-dep install
          # aborts. rm the self-contained directories only.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            /opt/microsoft \
            /opt/pipx \
            /usr/local/julia* \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== AFTER ==="; df -h /

      - name: Add swap (runner has only ~16GB RAM; AOSP needs more)
        run: |
          set -euo pipefail
          echo "=== memory before ==="; free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          # 16G is enough with the -j6 cap for a vendor_boot-only build and keeps
          # ~8G more disk free than 24G (one fs shared with the 85G sync + out/).
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=100 || true
          echo "=== memory after ==="; free -h; echo; df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick patch \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libncurses-dev python3 python-is-python3 openjdk-17-jdk-headless \
            android-sdk-libsparse-utils fontconfig e2fsprogs aria2

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name "ofox-ci"
          git config --global user.email "ofox-ci@localhost"
          git config --global color.ui false
          git config --global advice.detachedHead false

      - name: Prepare workspace on large disk
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/fox
          sudo chown "$(id -u):$(id -g)" /mnt/fox
          echo "FOXBASE=/mnt/fox" >> "$GITHUB_ENV"

      - name: Clone the OrangeFox sync repo
        run: |
          set -euo pipefail
          cd "$FOXBASE"
          # The sync repo carries the per-branch manifest/vold patches in its
          # patches/ dir; orangefox_sync.sh resolves them relative to $PWD, so it
          # MUST be run from inside this clone.
          git clone https://gitlab.com/OrangeFox/sync.git
          echo "SYNC=$FOXBASE/sync" >> "$GITHUB_ENV"

      - name: Sync OrangeFox + minimal manifest (official sync script)
        run: |
          set -euo pipefail
          cd "$SYNC"
          WS="$FOXBASE/fox_${{ inputs.fox_branch }}"
          echo "WS=$WS" >> "$GITHUB_ENV"
          # orangefox_sync.sh does repo init --depth=1 + repo sync, patches
          # system/vold + the manifest for 14.1, and clones the OrangeFox
          # recovery/vendor trees. No local patching needed afterwards.
          ./orangefox_sync.sh --branch "${{ inputs.fox_branch }}" --path "$WS"
          echo "=== synced; disk now ==="; df -h / /mnt
          test -d "$WS/build" || { echo "::error::sync did not produce a build/ dir"; exit 1; }
          test -d "$WS/bootable/recovery" || { echo "::error::OrangeFox recovery sources missing"; exit 1; }

      - name: Install device tree into the source
        run: |
          set -euo pipefail
          cd "$WS"
          mkdir -p device/volla/algiz
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            "$GITHUB_WORKSPACE/device_tree/" device/volla/algiz/
          echo "=== device tree contents ==="
          find device/volla/algiz -maxdepth 3 -type f | sort
          echo "=== assert prebuilt kernel is a gzip image ==="
          head -c4 device/volla/algiz/prebuilt/kernel.gz | od -An -tx1
          test -f device/volla/algiz/prebuilt/dtbo.img
          test -x device/volla/algiz/vendorsetup.sh || chmod +x device/volla/algiz/vendorsetup.sh

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          cd "$WS"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=algiz
          export OF_FORCE_PREBUILT_KERNEL=1
          # NOTE: no `set -u` — AOSP's envsetup.sh references unset vars.
          source build/envsetup.sh
          # Explicitly source the device vendorsetup.sh so the FOX_* env vars are
          # exported even on AOSP trees that no longer auto-source it.
          if [ -f device/volla/algiz/vendorsetup.sh ]; then
            source device/volla/algiz/vendorsetup.sh algiz || true
          fi

          want="${{ inputs.lunch_combo }}"
          echo "requested lunch combo: $want"
          if lunch "$want" 2>/tmp/lunch.err; then
            echo "lunch OK: $want"
          else
            echo "::warning::'$want' invalid; probing available release tokens"
            cat /tmp/lunch.err || true
            picked=""
            for rel in ap2a ap1a trunk_staging trunk bp1a next ""; do
              if [ -z "$rel" ]; then combo="twrp_algiz-eng"; else combo="twrp_algiz-${rel}-eng"; fi
              if lunch "$combo" 2>/dev/null; then picked="$combo"; break; fi
            done
            if [ -z "$picked" ]; then
              echo "::error::no valid release token found for twrp_algiz"
              echo "---- lunch combos ----"; list_products 2>/dev/null | head || true
              ls build/release/release_configs/*.textproto 2>/dev/null | sed 's#.*/##;s#\.textproto##' || true
              exit 1
            fi
            echo "lunch OK (fallback): $picked"
          fi

          # Cap parallelism: with ~16GB RAM + swap, full -j(nproc) link steps
          # thrash and get OOM-killed. Read PIPESTATUS[0] (mka) IMMEDIATELY after
          # the pipeline — grep's status would otherwise mask a failed build
          # (the classic false-green bug).
          jobs="$(nproc)"; if [ "$jobs" -gt 6 ]; then jobs=6; fi
          echo "building 'mka -j$jobs ${{ inputs.build_target }}'"
          set +e
          mka -j"$jobs" "${{ inputs.build_target }}" 2>&1 | tee /mnt/fox/build.log | \
            grep -iE 'error:|warning: overriding|make.*Error|Install:|target .*img|Build.*complete|ninja: build|FAILED:|OrangeFox'
          rc="${PIPESTATUS[0]}"
          set -e
          echo "=== mka exit status: $rc ==="
          if [ "$rc" -ne 0 ]; then
            echo "::error::mka failed with status $rc"
            exit "$rc"
          fi
          OUT="out/target/product/algiz/vendor_boot.img"
          if [ ! -f "$OUT" ]; then
            echo "::error::mka returned 0 but $OUT was not produced"
            exit 1
          fi
          echo "=== produced: $OUT ($(stat -c%s "$OUT") bytes) ==="

      - name: Collect outputs
        if: always()
        run: |
          set -euo pipefail
          cd "$WS" || exit 0
          OUTDIR="out/target/product/algiz"
          mkdir -p /mnt/fox/artifacts
          shopt -s nullglob
          for f in "$OUTDIR"/vendor_boot.img "$OUTDIR"/recovery.img \
                   "$OUTDIR"/boot.img "$OUTDIR"/ramdisk-recovery.* \
                   "$OUTDIR"/OrangeFox*.zip "$OUTDIR"/OrangeFox*.img \
                   "$OUTDIR"/*vendor_ramdisk_recovery.cpio*; do
            [ -f "$f" ] && cp -v "$f" /mnt/fox/artifacts/ || true
          done
          tail -c 400000 /mnt/fox/build.log > /mnt/fox/artifacts/build-tail.log || true
          echo "=== artifacts ==="
          ls -lh /mnt/fox/artifacts || true
          ( cd /mnt/fox/artifacts && sha256sum * > SHA256SUMS 2>/dev/null; cat SHA256SUMS ) || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-algiz-${{ github.run_number }}
          path: /mnt/fox/artifacts/*
          if-no-files-found: warn
          retention-days: 14
